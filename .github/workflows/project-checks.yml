name: Project Checks

on:
push:
branches: [main]
pull_request:
branches: [main]

jobs:
python-validation:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: Install lightweight dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install \
        pandas==2.2.2 \
        numpy==1.26.4 \
        great-expectations==0.18.21 \
        python-dotenv==1.0.1 \
        boto3==1.34.162

  - name: Generate mock data
    run: python data_generator/generate_mock_data.py

  - name: Validate raw data
    run: python quality/validate_raw_orders.py
```

terraform-validation:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Terraform
    uses: hashicorp/setup-terraform@v3

  - name: Terraform format check
    run: terraform fmt -check
    working-directory: terraform

  - name: Terraform init without backend
    run: terraform init -backend=false
    working-directory: terraform

  - name: Terraform validate
    run: terraform validate
    working-directory: terraform
```
