version: 2

sources:
  - name: ecommerce_lakehouse
    schema: ecommerce_lakehouse
    tables:
      - name: curated_customers
      - name: curated_products
      - name: curated_orders

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: order_amount
        tests:
          - not_null
